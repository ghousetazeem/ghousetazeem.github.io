<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07131f">
  <title>Resume | Ghouse Tazeem Mohd</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#07131f; --accent:#58d5ff; --text:#dbe8ef; --muted:#89a1b0; }
    *{box-sizing:border-box} body{margin:0;background:#06111c;color:var(--text);font-family:"DM Sans",Arial,sans-serif}
    .topbar{height:76px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;position:sticky;top:0;background:rgba(6,17,28,.92);backdrop-filter:blur(14px);z-index:2}
    .shell{width:min(1180px,calc(100% - 32px));margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font:600 16px "Space Grotesk",sans-serif}.brand span{color:var(--accent)}
    .actions{display:flex;gap:10px}.button{padding:10px 15px;border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:700;color:white;text-decoration:none}.button.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
    main{padding:42px 0 55px}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:24px}.intro p{margin:0;color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.15em}.intro h1{margin:8px 0 0;font:600 clamp(30px,5vw,50px) "Space Grotesk",sans-serif;letter-spacing:-.04em}.intro span{color:var(--muted);font-size:13px}
    .pdf-wrap{height:calc(100vh - 190px);min-height:650px;background:#fff;border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 90px rgba(0,0,0,.3)}iframe{width:100%;height:100%;border:0}
    .fallback{display:none;padding:40px;background:#0c2031}.fallback a{color:var(--accent)}
    @media(max-width:650px){.intro{align-items:flex-start;flex-direction:column}.actions .back-label{display:none}.pdf-wrap{height:72vh;min-height:500px}.topbar{height:68px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell bar">
      <div class="brand">GT<span>.</span> Aerospace Portfolio</div>
      <div class="actions">
        <a class="button" href="./index.html"><span class="back-label">Back to </span>Portfolio</a>
        <a class="button primary" href="./assets/docs/Ghouse-Tazeem-Mohd-Resume.pdf" download>Download PDF</a>
      </div>
    </div>
  </header>
  <main class="shell">
    <div class="intro">
      <div><p>Professional résumé</p><h1>Ghouse Tazeem Mohd</h1></div>
      <span>Aircraft Digital Twin &amp; Electrical Integration Engineer</span>
    </div>
    <div class="pdf-wrap">
      <iframe src="./assets/docs/Ghouse-Tazeem-Mohd-Resume.pdf#view=FitH" title="Ghouse Tazeem Mohd resume"></iframe>
      <div class="fallback">Your browser cannot display the PDF. <a href="./assets/docs/Ghouse-Tazeem-Mohd-Resume.pdf">Open the resume directly.</a></div>
    </div>
  </main>
</body>
</html>
